version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: y-hakua-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: y-hakua
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - y-hakua-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: y-hakua-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - y-hakua-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: y-hakua-backend
    ports:
      - "8800:8800"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://root:password@mongodb:27017/y-hakua?authSource=admin
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      PORT: 8800
      JWT_SECRET: your_jwt_secret_key_change_this_in_production
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - y-hakua-network
    command: npm start

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: y-hakua-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8800
      REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - y-hakua-network
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
  mongodb_config:
  redis_data:

networks:
  y-hakua-network:
    driver: bridge
